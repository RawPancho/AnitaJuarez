<!DOCTYPE html>
<html>
<head>
  <title>Acta Laboral v2.0 - HTTP Post</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=yes">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body class="body">

  <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 10000; text-align: center; padding-top: 20%;">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <p style="margin-top: 15px; font-weight: bold; color: #007bff;">Procesando...</p>
</div>

<div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <h3>Ingrese Contraseña de Acceso</h3>
    <input type="password" id="pass-input" class="form-control" style="width:250px;">
    <br>
    <button onclick="ValidarYEntrar()" class="btn btn-primary">Entrar</button>
</div>

<div id="main-content" style="display:none;">
   </div>
   
  <div id="flash-message" class="flash-hidden"></div>

  <div class="separaciones">
    <ul class="nav nav-tabs" id="menu-entradas">
      <li class="nav-item"><a class="nav-link active" data-toggle="tab" href="#tab1">Reportar</a></li>
      <li class="nav-item"><a class="nav-link" data-toggle="tab" href="#tab2">Compartidos</a></li>
    </ul>
  </div>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab1">
      <div class="container">
        <div class="separaciones">
          <label>Reportar en el acta</label><br>
          <input type="text" id="txt_reporte" class="text-boxpand" autocomplete="off"><br><br>
          
          <label>Emisor</label><br>
          <select id="pReportar" class="list_profesional">
            <option value="">Selecciona</option>
            <option value="ID1">Pela</option>
            <option value="ID2">Eli</option>
          </select>
          <input id="pReportarID" type="text" class="input_profesional" placeholder="ID" maxlength="2" style="width:50px" />
          <br><br>
          <button type="button" onclick="EnviarReporte()">Enviar Reporte</button>
        </div>
      </div>
    </div>
    <div class="tab-pane fade" id="tab2">
      <div class="container">
        <div class="separaciones">
          <h3>Servicio Compartido</h3>
          <label>Vendedor</label>
          <select id="pVendio_sc" class="list_profesional"><option value="">Selecciona</option></select>
          <input id="pVendioID" type="text" class="input_profesional" placeholder="ID" maxlength="2" style="width:40px"/><br>
          
          <label>Hizo</label>
          <select id="pHizo_sc" class="list_profesional"><option value="">Selecciona</option></select>
          <input id="pHizoID" type="text" class="input_profesional" placeholder="ID" maxlength="2" style="width:40px"/><br>
          
          <input type="text" id="txt_sc" class="text-box"> <label>Servicio</label><br>
          <input type="text" id="txt_Cliente_sc" class="text-box"> <label>Clienta</label><br>
          <button type="button" onclick="EnviarServicioCompartido()">Cargar Servicio Compartido</button>
        </div>
        
      </div>

    </div>
<hr>
<div class="container text-center">
    <div id="lista-ultimos" style="margin-top: 20px; font-size: 0.9em; text-align: left;"></div>
</div>
  </div>

  <script type="text/javascript">

//AUTENTICACION Y CARGA DE DATOS INICIAL

    let TOKEN = "";

async function ValidarYEntrar() {
    const pass = document.getElementById('pass-input').value;
    const datosEnvio = {
        token: pass,
        CasoParticular: "CargarDatos"
    };
    MostrarCargando();

    try {
        // Para esto, el script de Google debe devolver JSON correctamente.
        const response = await fetch(URL_SCRIPT, {
            method: "POST",
            body: JSON.stringify(datosEnvio)
        });
        
        const data = await response.json();

        if (data.empleados) {
            TOKEN = pass; // Guardamos el token para futuros envíos
            LlenarSelects(data);
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }
    } catch (error) {
        alert("Contraseña incorrecta o error de conexión");
        console.error(error);
    } finally {
        OcultarCargando();
    } 
ConsultarUltimos(); // Carga los últimos reportes al entrar
}

function LlenarSelects(data) {
    const opcionesEmp = data.empleados.map(n => `<option value="${n}">${n}</option>`).join('');
    const opcionesServ = data.servicios.map(s => `<option value="${s}">${s}</option>`).join('');

    document.getElementById('pReportar').innerHTML = '<option value="">Selecciona</option>' + opcionesEmp;
    document.getElementById('pVendio_sc').innerHTML = '<option value="">Selecciona</option>' + opcionesEmp;
    document.getElementById('pHizo_sc').innerHTML = '<option value="">Selecciona</option>' + opcionesEmp;
    document.getElementById('txt_sc').outerHTML = `<select id="txt_sc" class="form-control">${opcionesServ}</select>`;
}
// AUTENTICACION Y CARGA DE DATOS INICIAL
    // --- CONFIGURACIÓN ---
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbw--3Z5sAedSC26Q4Bt_HZ_l7J-M8QqskZkQjZH0za0k7R5HZu9lNAFi1URTljJ1JQJ/exec"; 

    // --- LÓGICA DE ENVÍO CENTRALIZADA ---
    async function EnviarA_Google(datos) {
      datos.token = TOKEN; // Agregamos el token de seguridad
      MostrarCargando();
      console.log("1. Iniciando envío...", datos); // Ver qué datos estás mandando

  try {
    // Registramos el inicio del fetch
    console.time("Tiempo de respuesta"); 
    
    const response = await fetch(URL_SCRIPT, {
      method: "POST",
      mode: "no-cors", 
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(datos)
    });

    console.timeEnd("Tiempo de respuesta");
    console.log("2. Fetch finalizado (Nota: no-cors no permite ver el cuerpo de la respuesta)");
    
    FlashPantalla("¡Enviado con éxito!");
    ConsultarUltimos(); // Actualiza la lista de últimos reportes después de enviar
    LimpiarCampos();

  } catch (error) {
    console.error("¡ERROR DETECTADO!", error);
    FlashPantalla("Error al enviar");
  } finally {
    OcultarCargando();  
    } }

    // --- FUNCIONES DE CADA BOTÓN ---
    function EnviarReporte() {
      const datos = {
        CasoParticular: "Reporte",
        Autor: document.getElementById('pReportar').selectedOptions[0].text,
        Reporte: document.getElementById('txt_reporte').value
      };
      if(datos.Autor === "Selecciona" || !datos.Reporte) return FlashPantalla("Faltan datos");
      EnviarA_Google(datos);
    }

    function EnviarServicioCompartido() {
      const datos = {
        CasoParticular: "NutricionCompartida",
        Vendedor: document.getElementById('pVendio_sc').selectedOptions[0].text,
        Aplicador: document.getElementById('pHizo_sc').selectedOptions[0].text,
        Servicio: document.getElementById('txt_sc').value,
        Cliente: document.getElementById('txt_Cliente_sc').value
      };
      if(!datos.Vendedor || !datos.Cliente) return FlashPantalla("Faltan datos");
      EnviarA_Google(datos);
    }

    // --- TWEAKS Y MEJORAS VISUALES ---
    function FlashPantalla(message) {
      const flash = document.getElementById('flash-message');
      flash.textContent = message;
      flash.className = 'flash-visible';
      setTimeout(() => { flash.className = 'flash-hidden'; }, 3000);
    }

    function LimpiarCampos() {
      document.querySelectorAll('input').forEach(i => i.value = '');
      document.querySelectorAll('select').forEach(s => s.value = '');
    }

    // Autocompletado simple por ID
    document.querySelectorAll('.input_profesional').forEach(input => {
      input.addEventListener('input', function() {
        const sel = this.previousElementSibling;
        sel.value = this.value.toUpperCase(); // Asume que el ID en el select es igual al ID ingresado
      });
    });
    
async function ConsultarUltimos() {
    const divLista = document.getElementById('lista-ultimos');
    divLista.innerHTML = "Consultando...";

    const datosEnvio = {
        token: TOKEN, // Usamos el token que ya tenemos guardado
        CasoParticular: "VerUltimos"
    };

    try {
        const response = await fetch(URL_SCRIPT, {
            method: "POST",
            body: JSON.stringify(datosEnvio)
        });
        const data = await response.json();

        let html = "<h5>Últimos Reportes:</h5><ul>";
        data.ultimosReportes.reverse().forEach(fila => {
            html += `<li><strong>${fila[2]} ${fila[3]}:</strong> ${fila[0]} (por ${fila[1]})</li>`;
        });
        
        html += "</ul><h5>Últimos Compartidos:</h5><ul>";
        data.ultimosNutricion.reverse().forEach(fila => {
            html += `<li><strong>${fila[3]}:</strong> ${fila[4]} compró ${fila[2]}</li>`;
        });
        html += "</ul>";

        divLista.innerHTML = html;

    } catch (error) {
        divLista.innerHTML = "Error al obtener datos.";
        console.error(error);
    }
}
function MostrarCargando() {
    document.getElementById('loading-overlay').style.display = 'block';
}
function OcultarCargando() {
    document.getElementById('loading-overlay').style.display = 'none';
}
  </script>
</body>
</html>
